name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'audit/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate dependency consistency
        run: python -m pip check

      - name: Capture resolved dependency set
        run: python -m pip freeze --all | Out-File -Encoding utf8 resolved-dependencies.txt

      - name: Upload resolved dependency set
        uses: actions/upload-artifact@v4
        with:
          name: resolved-dependencies-python312-windows
          path: resolved-dependencies.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify imports
        run: python verify_imports.py

      - name: Run pytest with coverage
        run: python -m pytest -q

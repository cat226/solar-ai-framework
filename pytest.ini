# =============================================================================
# Solar AI Framework - pytest configuration
# =============================================================================
#
# Canonical test environment: Python 3.12
#
#   Run the suite:        py -3.12 -m pytest
#   Single test file:     py -3.12 -m pytest tests/test_physics.py
#
# Coverage is always-on for the core source packages below.  There is NO
# coverage fail threshold yet -- thresholds are decided in a later Sprint 3.3
# task once the initial test suite exists.
#
# Coverage sources deliberately exclude app.py: it executes Streamlit page
# setup at import time and is not import-safe outside a running session.
# =============================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config --cov=services --cov=models --cov=utils --cov-report=term-missing

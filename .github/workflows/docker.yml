name: Docker

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'audit/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build --tag solar-ai-framework:ci .

      - name: Verify container runs as unprivileged user
        run: test "$(docker run --rm solar-ai-framework:ci id -u)" != "0"

      - name: Verify artifact readiness fails closed without model files
        run: |
          set +e
          docker run --rm solar-ai-framework:ci python scripts/check_runtime_readiness.py > readiness.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("readiness.json").read_text())
          assert payload["liveness"] == "ok"
          assert payload["inference_readiness"] == "not_ready"
          assert set(payload["missing_artifacts"]) == {
              "detector",
              "classifier",
              "predictor",
          }
          PY

      - name: Start container
        run: docker run --detach --name solar-ai-framework-ci --publish 8501:8501 solar-ai-framework:ci

      - name: Wait for Streamlit health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs solar-ai-framework-ci
          exit 1

      - name: Show container status
        if: always()
        run: docker ps -a --filter name=solar-ai-framework-ci

      - name: Show container logs on failure
        if: failure()
        run: docker logs solar-ai-framework-ci

      - name: Stop container
        if: always()
        run: docker rm --force solar-ai-framework-ci

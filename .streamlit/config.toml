[server]
headless = true
address = "0.0.0.0"
port = 8501
maxUploadSize = 10
enableXsrfProtection = true

[client]
# Streamlit's own default ("full") shows the exception type, message, AND
# full traceback to the browser for any uncaught exception - including one
# from a bug in page-rendering code that isn't wrapped in app.py's own
# try/except around the pipeline call. "none" keeps that information
# server-side only (still fully visible in the real logs via utils.logger),
# matching this project's existing principle (docs/RUNTIME_SECURITY.md):
# never expose uncontrolled tracebacks in the UI.
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[theme]
# Solar AI palette: warm amber (solar/energy) on a clean slate-neutral base —
# an industrial-intelligence look rather than a generic "green energy" one.
primaryColor = "#D97B29"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#111827"
font = "sans serif"

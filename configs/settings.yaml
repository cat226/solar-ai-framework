# =============================================================================
# Solar AI Framework — Central Configuration
# configs/settings.yaml
# =============================================================================

# ---------------------------------------------------------------------------
# Weather API
# ---------------------------------------------------------------------------
# NOTE: The API key is NOT stored here.
# Set OPENWEATHER_API_KEY in .env or .streamlit/secrets.toml.
# See .env.example and .streamlit/secrets.toml.example for templates.
weather:
  base_url: "https://api.openweathermap.org/data/2.5/weather"
  timeout_seconds: 10
  default_city: "Chennai"
  units: "metric"
  defaults:
    ambient_temp_c: 25.0
    humidity_pct: 50.0
    wind_speed_ms: 2.0
    cloud_cover_pct: 0.0
    pressure_hpa: 1013.25
    latitude: 0.0
    longitude: 0.0

# ---------------------------------------------------------------------------
# Model Paths  (relative to project root)
# ---------------------------------------------------------------------------
models:
  yolo:
    weights: "weights/yolo_solar.pt"
    # Recalibrated 2026-09-05 (Phase 6B) from 0.45, using a confidence-
    # threshold sweep (0.05-0.90) on the VALIDATION split only (never the
    # test split - see docs/ML_HARDENING_PHASE6B.md for the full grid,
    # methodology, and its disclosed limitations). 0.45 measured
    # precision=0.493/recall=0.179/F1=0.263 on real validation data; 0.30
    # was the best-F1 grid point at precision=0.334/recall=0.304/F1=0.318
    # (F1 is fairly flat across roughly 0.25-0.40 - this is a representative
    # point in that range, not a sharp, uniquely-optimal value). This
    # materially improves recall (catches more real panels) at a real
    # precision cost, and was NOT selected by optimizing against the test
    # split. It does not make detection "good" in an absolute sense -
    # F1~0.32 remains modest - see the v1.0.0 ML evaluation docs for the
    # full, honest picture (including a domain-shift limitation this
    # threshold change cannot fix).
    confidence_threshold: 0.30
    iou_threshold: 0.50
    image_size: 640
  mobilenet:
    # v1 (frozen, current) classifier: the real, actively-loaded artifact for
    # this release, covering the three classes with genuinely licensed data.
    # This is not a placeholder or a fallback - it IS the v1 production
    # classifier. See training/classification/DATASET_SOURCES.md for why
    # Bird-Drop/Electrical-Damage/Physical-Damage remain a documented future
    # expansion rather than part of this release.
    v1_weights: "weights/mobilenet_solar_v1.pth"
    v1_labels:
      - "Clean"
      - "Dusty"
      - "Hotspot"
    # Future six-class artifact: not yet trained (no artifact exists at this
    # path). ModelManager prefers this automatically the moment it exists -
    # see models/model_manager.py's mobilenet_status property - so acquiring
    # the three missing classes' data and training this later requires no
    # application code changes.
    weights: "weights/mobilenet_solar.pth"
    num_classes: 6
    input_size: 224
  xgboost:
    weights: "weights/xgboost_solar.joblib"

# ---------------------------------------------------------------------------
# Classification Labels
# ---------------------------------------------------------------------------
classification:
  labels:
    - "Clean"
    - "Dusty"
    - "Bird-Drop"
    - "Electrical-Damage"
    - "Physical-Damage"
    - "Hotspot"

# ---------------------------------------------------------------------------
# Physics Constants
# ---------------------------------------------------------------------------
physics:
  # Irradiance
  max_irradiance_wm2: 1000.0          # Peak irradiance W/m² (clear sky, noon)
  irradiance_cloud_factor: 0.75       # Legacy compatibility; runtime derives attenuation from cloud cover

  # Module Temperature — NOCT model: Tcell = Ta + (NOCT-20)/800 * G
  noct_celsius: 45.0
  noct_irradiance_ref: 800.0
  noct_ambient_ref: 20.0
  wind_cooling_coefficient: 1.5

  # Temperature coefficient of power
  temp_coefficient_pmax: -0.004
  stc_temperature: 25.0

  # Soiling ratios per fault class
  soiling_ratios:
    "Clean": 1.00
    "Dusty": 0.92
    "Bird-Drop": 0.88
    "Electrical-Damage": 0.80
    "Physical-Damage": 0.75
    "Hotspot": 0.70

  # Default panel rating
  panel_rated_power_wp: 400.0

# ---------------------------------------------------------------------------
# Feature Engineering
# ---------------------------------------------------------------------------
feature_engineering:
  feature_columns:
    - "irradiance_wm2"
    - "module_temp_c"
    - "ambient_temp_c"
    - "humidity_pct"
    - "wind_speed_ms"
    - "cloud_cover_pct"
    - "soiling_ratio"
    - "fault_class_id"
    - "detection_confidence"

# ---------------------------------------------------------------------------
# Recommendation Thresholds
# ---------------------------------------------------------------------------
recommendations:
  efficiency_loss_critical_pct: 20.0
  efficiency_loss_warning_pct: 10.0
  hotspot_max_temp_c: 65.0
  cleaning_humidity_threshold_pct: 85

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s — %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
